name: Build and Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        run: nuget restore src\myoddweb.directorywatcher.sln

      - name: Build solution
        run: msbuild src\myoddweb.directorywatcher.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Run C# tests
        run: dotnet test src\myoddweb.directorywatcher.test\myoddweb.directorywatcher.test.csproj --configuration Release --no-build

      - name: Run C++ tests
        run: .\src\bin\Release\Win32\myoddweb.directorywatcher.win.test.exe
